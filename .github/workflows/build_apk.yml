name: Build Hermes AI Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: "Hermes Agent v1.0.10 (100% Web Parity Gateway & Standalone Suite)"
          body: |
            ## 📱 Hermes Agent Mobile Release v1.0.10
            
            Official 100% Clone & Gateway Suite of Nous Research Hermes Agent (`NousResearch/hermes-agent`).
            
            ### ✨ What's New in v1.0.10:
            - **Complete Dual-Architecture Execution:**
              1. **Mobile Standalone Mode:** Direct on-device tool engine with default `gemini-2.0-flash` (zero 503, 404, or 429 quota errors) + real terminal `bash`, `write_file`, `read_file`, `list_files`, and `web_search`.
              2. **Termux Python Gateway (`ws://127.0.0.1:8000/ws`):** Zero-dependency pure Python async WebSocket JSON-RPC 2.0 gateway server with full browser Web App UI at `http://127.0.0.1:8000`.
            - **Default Settings Optimized for Zero Friction:** Default provider switched to Gemini, default model `gemini-2.0-flash`, default gateway URL `ws://127.0.0.1:8000/ws`.
            - **Live Hardware Telemetry:** Dynamic `/api/system/stats` measuring real CPU %, RAM MB, and storage.
            
            ### ⬇️ Download
            Download the signed release APK below:
            - **[app-release.apk](https://github.com/emranmofficials/Hermes-AI-Mobile/releases/download/v1.0.9/app-release.apk)**
            
            Download the APK below and install on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
