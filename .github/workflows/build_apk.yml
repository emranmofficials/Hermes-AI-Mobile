name: Build Hermes AI Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.12
          name: "Hermes Agent v1.0.12 (Dynamic Versioning & Active Gemini Engine)"
          body: |
            ## 📱 Hermes Agent Mobile Release v1.0.12
            
            Official 100% Clone & Gateway Suite of Nous Research Hermes Agent (`NousResearch/hermes-agent`).
            
            ### ✨ What's Fixed in v1.0.12:
            - **Dynamic Android App Versioning (Fixed Stale 1.0.6):** Resolved hardcoded `versionCode: 7` and `versionName: 1.0.6` in `android/app/build.gradle.kts`. App now dynamically links `flutter.versionCode` and `flutter.versionName`, correctly displaying `v1.0.12` in Android Settings and Drawer!
            - **Eliminated Deprecated Models (Fixed 404):** Replaced legacy `gemini-1.5-*` with active `gemini-3.8-flash`, `gemini-3.5-flash-lite`, and `gemini-3.1-flash-lite`.
            
            ### ⬇️ Download
            Download the signed release APK below:
            - **[app-release.apk](https://github.com/emranmofficials/Hermes-AI-Mobile/releases/download/v1.0.9/app-release.apk)**
            
            Download the APK below and install on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
