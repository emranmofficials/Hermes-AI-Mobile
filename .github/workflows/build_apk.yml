name: Build Hermes AI Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Hermes Agent v1.0.3 Release"
          body: |
            ## 📱 Hermes Agent Mobile Release v1.0.3
            
            Official 100% Mobile Clone of Nous Research Hermes Agent Webapp & Dashboard (`NousResearch/hermes-agent`).
            
            ### ✨ What's New in v1.0.3
            - **Google Gemini API Provider Integration:** Added first-class Google Gemini support in Settings with quick model chips (`gemini-2.5-pro`, `gemini-2.5-flash`, `gemini-1.5-pro`, `gemini-1.5-flash`).
            - **Interactive Plugin & Marketplace Store:** 1-click addition of official cloud and design plugins:
              - ⚡ **Supabase Cloud Backend** (PostgreSQL, Realtime, Auth, Storage)
              - 🔥 **Firebase Cloud Services** (Firestore, Cloud Functions, Security Rules, Auth)
              - 🎨 **Canva Creative Studio** (Banners, Social graphics, AI Marketing designs)
              - 📐 **Figma to Code** (Figma to Flutter & Web code generation)
              - ☁️ **Cloudflare Edge Cloud** (Deploy websites to Cloudflare Pages & Workers)
              - 🌐 **Netlify Hosting** (Instant web preview & serverless forms)
              - 🐙 **GitHub Teamwork** (Git commits, PR creation, CI/CD Actions)
              - 🕷️ **Web Scraping & Browser Automation** (Puppeteer & live web crawling)
            - **One-by-One Plugin Addition:** Tap to add, configure API keys, and manage plugins smoothly.
            
            Download the APK below and install on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
