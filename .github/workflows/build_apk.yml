name: Build Hermes AI Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Hermes Agent v1.0.4 Release"
          body: |
            ## 📱 Hermes Agent Mobile Release v1.0.4
            
            Official 100% Mobile Clone of Nous Research Hermes Agent Webapp & Dashboard (`NousResearch/hermes-agent`).
            
            ### ✨ What's New in v1.0.4
            - **Updated Google Gemini Models:** Updated Gemini model identifier to `gemini-3.1-pro-preview` and `gemini-2.5-flash` following Google API deprecation of `gemini-2.5-pro`.
            - **Interactive Model Switcher:** Tap model name in chat header to directly access and switch models.
            - **Plugin Marketplace:** Full 1-click addition of Supabase, Firebase, Canva, Figma, Cloudflare, Netlify, GitHub, and Web Scraper.
            
            Download the APK below and install on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
