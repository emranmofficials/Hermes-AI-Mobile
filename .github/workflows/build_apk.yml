name: Build Hermes AI Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.11
          name: "Hermes Agent v1.0.11 (Active Gemini 3.8 & 3.5 Flash-Lite Resilient Release)"
          body: |
            ## 📱 Hermes Agent Mobile Release v1.0.11
            
            Official 100% Clone & Gateway Suite of Nous Research Hermes Agent (`NousResearch/hermes-agent`).
            
            ### ✨ What's Fixed in v1.0.11:
            - **Eliminated Deprecated Models (Fixed 404):** Google has retired legacy `gemini-1.5-*` and `gemini-2.0-*` models. All fallbacks are now fully migrated to active, supported models:
              - Flagship: `gemini-3.8-flash`
              - High-Throughput Fallback: `gemini-3.5-flash-lite` (Never 503 Server Busy)
              - Lightweight Backup: `gemini-3.1-flash-lite`
            - **Zero-Demand Quota Safety:** Automatically handles Google traffic spikes without stopping the agent.
            
            ### ⬇️ Download
            Download the signed release APK below:
            - **[app-release.apk](https://github.com/emranmofficials/Hermes-AI-Mobile/releases/download/v1.0.9/app-release.apk)**
            
            Download the APK below and install on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
