name: Build Hermes AI Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Hermes Agent v1.0.8 (Real Autonomous Engine Release)"
          body: |
            ## 📱 Hermes Agent Mobile Release v1.0.8 (Real Autonomous Engine Release)
            
            Official 100% Mobile Clone of Nous Research Hermes Agent Webapp & Dashboard (`NousResearch/hermes-agent`).
            
            ### ✨ What's Fixed & Implemented in v1.0.8:
            - **Removed All Simulated / Dummy Loops:** Permanently eliminated all canned mock responses.
            - **Real On-Device Tool Execution Engine (`ToolExecutor`):**
              - `bash`: Actually executes real shell commands via `Process.run('sh')` on Android/Termux and captures real stdout/stderr.
              - `write_file`: Actually creates and saves real code and files on disk.
              - `read_file`: Actually reads and inspects real files from the workspace.
              - `list_files`: Real directory tree browsing and file listing.
              - `web_search`: Real live internet queries via DuckDuckGo.
            - **Multi-Turn Autonomous Tool Loop:** AI generates tool calls, device executes them in real time, and feeds outputs back into the reasoning loop.
            - **100% Web Parity Suite:** MCP Manager, WhatsApp QR pairing, Telegram bot, Profiles & SOUL.md editor, Cron scheduler, Secrets Vault, Analytics, and Telemetry.
            
            ### ⬇️ Download
            Download the signed release APK below:
            - **[app-release.apk](https://github.com/emranmofficials/Hermes-AI-Mobile/releases/download/v1.0.8/app-release.apk)**
            
            Download the APK below and install on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
