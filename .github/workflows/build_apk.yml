name: Build Hermes AI Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "Hermes Agent v1.0.9 (Resilient Fallback & Quick Model Switcher Release)"
          body: |
            ## 📱 Hermes Agent Mobile Release v1.0.9
            
            Official 100% Mobile Clone of Nous Research Hermes Agent Webapp & Dashboard (`NousResearch/hermes-agent`).
            
            ### ✨ What's New in v1.0.9:
            - **Automatic HTTP 503 Resilient Fallback:** When Google Gemini servers report temporary high demand (HTTP 503), the engine automatically falls back to `gemini-2.0-flash` or `gemini-1.5-flash` so your prompt never fails!
            - **Header Quick Model Switcher:** Tap the model chip in the chat header to instantly switch between `gemini-2.0-flash`, `gemini-1.5-flash`, `gemini-3.8-flash`, `gemini-3.1-pro-preview`, and `hermes-3-405b`.
            - **Real On-Device Tool Execution:** Live bash commands on Termux/Android, real file creation/editing, and live web search.
            
            ### ⬇️ Download
            Download the signed release APK below:
            - **[app-release.apk](https://github.com/emranmofficials/Hermes-AI-Mobile/releases/download/v1.0.9/app-release.apk)**
            
            Download the APK below and install on your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
